# candidates.conf - what 3_debloat.sh looks for. Safe to edit; regexes are matched against
# package names, case-insensitively (grep -E). Fields are separated by "|"; the last field
# (the regex) may itself contain "|".
#
#   protect|<regex>                                        never offered, whatever else matches
#   feature|<id>|<default y/n>|<question>|<regex>          answering yes keeps every match
#   category|<id>|<default y/n>|<title>|<description>|<regex>   offered as one group
#
# Your dock apps (config/dock.txt), the new launcher and the current home screen are always protected.

# ---- never touch: core Android, Google services, the chip vendor's drivers, TCL's essentials ----
protect|^android$|^android\.|^com\.android\.
protect|^com\.google\.android\.(gms|gsf|vending|webview|tts|tv\.settings|tvkeyboard|leanback\.ime|inputmethod|apps\.tv\.launcherx|tvlauncher|leanbacklauncher|tungsten\.setupwraith|tv\.remote|youtube\.tv$|packageinstaller|permissioncontroller|ext\.|modulemetadata|networkstack|configupdater|partnersetup|backuptransport|syncadapters|onetimeinitializer|sss|setupwizard|apps\.tv\.settings|tv\.frameworkpackagestubs)
protect|^com\.mediatek\.|^com\.mstar\.|^com\.realtek\.|^com\.amlogic\.
protect|^com\.tcl\.(tv|settings|dashboard|initsetup|factory|fota|ota|versionupdate|systemupdate|upgrade|tvinput|inputsource|source|picture|audio|sound|display|rcu|remote|bluetooth|keyboard|ime|provider|providers|framework|service|systemserver|devicemanager|tvmanager|hdmi|cec|account|usercenter|useragreement|privacy|keystone|launcher\.overlay|overlay)(\.|$|_)
protect|update|upgrade|updater|(^|\.)f?ota($|\.)
protect|^com\.netflix\.|^com\.amazon\.amazonvideo|^com\.disney\.|^com\.hulu\.|^com\.peacocktv\.|^com\.wbd\.|^com\.hbo\.

# ---- features you might use: answering "yes" keeps everything that matches ----
feature|voice|y|Voice search / the microphone button on the remote (Google Assistant)?|katniss|assistant|speech|voice|hotword|googlequicksearchbox|(^|\.)tts($|\.)
feature|cast|y|Casting or mirroring to the TV from a phone or laptop (Chromecast, Miracast)?|cast|mediashell|miracast|wfd|mirror|nscreen|multiscreen|eshare|(^|\.)dial|airplay|screenshare|projection
feature|livetv|y|Live TV from an antenna / cable tuner / the channel guide?|livetv|tuner|epg|\.dtv|\.atv|tvinput|channelscan|^com\.google\.android\.tv$|tvguide|pvr|timeshift
feature|cec|y|HDMI-CEC (TV remote controlling a soundbar, console or box)?|cec|hdmi|soundbar
feature|fast|n|TCL Channel / free ad-supported streaming channels (Pluto TV, Tubi, Xumo)?|waterfall|tclchannel|tcl.*channel|pluto|tubi|freevee|xumo|localnow|crackle
feature|smarthome|n|Smart-home features (Google Home, SmartThings, Alexa, cameras on the TV)?|smarthome|alexa|amazon\.avs|smartthings|googlehome|camera|(^|\.)iot|homeauto|ifttt
feature|screensaver|y|Screensaver / ambient mode / photo frame?|dream|ambient|screensaver|photoframe|backdrop
feature|games|y|Games or a game controller?|game|stadia|controller|gamepad
feature|access|y|Kids / parental controls or accessibility features (TalkBack, captions)?|talkback|marvin|accessib|caption|kids|parental|family|magnifier

# ---- groups offered for disabling, in this order ----
category|ads|y|Advertising and ad services|Ad networks / ad-delivery components bundled by the manufacturer or an app.|(^|\.)ads?($|\.)|adservice|adsdk|advert|tvads?($|\.)|admob|adserver|adsplatform|splashad|bootad|ottad
category|telemetry|y|Analytics, telemetry and viewing-data collection|Components that report usage or what you watch (includes automatic content recognition / 'viewing data' services).|analytic|telemetry|(^|\.)bi($|\.)|bigdata|datacollect|datareport|(^|\.)logger($|\.)|logcollect|logupload|crashreport|(^|\.)acr($|\.|service|sdk)|samba|tvinsight|alphonso|inscape|nielsen|tracking|tracker|statistic|beacon|(^|\.)dcs($|\.)
category|promo|y|Promotions, hot-key shortcuts, free ad-supported channels|Preinstalled promo content, sponsored shortcut buttons, 'recommended' rows, app-store nags and free ad-supported channel apps.|promo|hotkey|partnercustomizer|messagebox|esticker|waterfall|tclchannel|recommend|appmarket|appstore|t_store|tstore|featured|showcase|retaildemo|storemode|shopmode|pluto|tubi|xumo|freevee
category|feedback|y|Feedback and survey prompts|Nag screens asking for feedback, surveys or ratings.|feedback|survey|questionnaire|bugreport
